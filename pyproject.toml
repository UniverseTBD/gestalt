[project]
name = "the-bazaar"
version = "0.2.0"
description = "Aligned-basket evaluation of foundation models on astronomical linear-probe tasks."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Mike Smith", email = "mikejamesjsmith@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "polars>=0.20",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "datasets>=2.14",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "huggingface_hub>=0.20",
    "pyarrow>=14.0",
    # Image → embedding (vendored from platonic-universe)
    "torch>=2.8.0",
    "transformers>=4.55.0",
    "astropt>=2.0.5",
    "opencv-python>=4.11.0.86",
    "scikit-image>=0.25.2",
    "pillow>=11.0",
    "torchvision>=0.20",
    "accelerate>=1.0.0",
]

[project.scripts]
bazaar = "bazaar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar"]

[tool.hatch.build.targets.wheel.force-include]
"src/bazaar/embed/data/percentiles.json" = "bazaar/embed/data/percentiles.json"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
